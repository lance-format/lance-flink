name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Flink ${{ matrix.flink }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 仓库当前维护两个版本矩阵：
        #   - 1.20（最后一个 1.x LTS，JDK 11/17/21）
        #   - 2.1（首个适配版本，JDK 17/21；Flink 2.x 要求 JDK 17+）
        # 1.18 / 1.19 were dropped along with the Flink 2.1 support work (issue #85).
        include:
          - flink: "1.20"
            java: "11"
          - flink: "1.20"
            java: "17"
          - flink: "1.20"
            java: "21"
          - flink: "2.1"
            java: "17"
          - flink: "2.1"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run unit tests (lance-flink-${{ matrix.flink }})
        run: mvn -B -ntp -am -pl lance-flink-${{ matrix.flink }} verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-flink${{ matrix.flink }}-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

